name: build-installers

# Manual installer builds for people who do not use EAS or the signed desktop release:
# an unsigned x64 Windows NSIS installer, and a release-mode Android APK signed with the
# generated debug keystore for sideloading.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-installers
  cancel-in-progress: true

jobs:
  windows:
    name: Windows EXE
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate the database client
        run: pnpm db:generate
        env:
          DATABASE_URL: postgres://unibots:unibots@127.0.0.1:5433/unibots

      - name: Build renderer and Electron main process
        run: pnpm --filter @unibots/web build && pnpm --filter @unibots/desktop build
        env:
          UNIBOTS_ALLOW_DEV_SECRETS: "1"

      - name: Package the x64 installer
        run: pnpm --filter @unibots/desktop exec electron-builder --win --x64 --publish never

      - name: Check the installer exists
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem "apps/desktop/out/*.exe")
          if ($installers.Count -lt 1) { throw "electron-builder produced no installer" }
          $installers | ForEach-Object { "{0} ({1:N0} bytes)" -f $_.Name, $_.Length }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unibots-windows-exe
          path: apps/desktop/out/*.exe
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate the native Android project
        working-directory: apps/mobile
        env:
          CI: "1"
          EXPO_NO_GIT_STATUS: "1"
          EXPO_NO_TELEMETRY: "1"
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Build the release APK
        working-directory: apps/mobile/android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4096m
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Check the APK exists
        run: |
          set -euo pipefail
          ls -l apps/mobile/android/app/build/outputs/apk/release/
          test "$(head -c 2 apps/mobile/android/app/build/outputs/apk/release/app-release.apk)" = "PK"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unibots-android-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
