appId: com.unibots.app
name: Unibots mobile smoke
---
- launchApp:
    clearState: true

- assertVisible: "Sign up for Unibots"
- assertVisible: "Name"
- tapOn: "Sign in"
- runFlow:
    when:
      true: ${typeof UNIBOTS_MOBILE_API_URL !== "undefined" && UNIBOTS_MOBILE_API_URL != null && UNIBOTS_MOBILE_API_URL.trim() !== ""}
    file: helpers/server.yaml
- assertVisible: "Sign in to Unibots"
- tapOn: "Email"
- inputText: ${UNIBOTS_E2E_EMAIL}
- tapOn: "Password"
- inputText: ${UNIBOTS_E2E_PASSWORD}
- hideKeyboard
- tapOn: "Sign in"

- extendedWaitUntil:
    visible: "Create"
    timeout: 30000
- tapOn: "Create"
- tapOn: "New bot"

- extendedWaitUntil:
    visible: "Message…"
    timeout: 30000
- tapOn: "Message…"
- inputText: ${UNIBOTS_E2E_MESSAGE}
- pressKey: Enter
- assertVisible: ${UNIBOTS_E2E_MESSAGE}

- tapOn: "Bot actions"
- tapOn: "Open computer"
- extendedWaitUntil:
    visible: "Open computer"
    timeout: 30000
- tapOn: "Open computer"
- extendedWaitUntil:
    visible: "You have control"
    timeout: 90000
- tapOn: "Close computer"
- tapOn: "Release"
- extendedWaitUntil:
    visible: "Take control"
    timeout: 30000
