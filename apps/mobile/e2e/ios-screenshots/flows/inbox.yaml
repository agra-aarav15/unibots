appId: com.unibots.app
name: Inbox
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      UNIBOTS_ACTIVE_EMAIL: ${UNIBOTS_SCREENSHOT_EMAIL}
- extendedWaitUntil:
    visible: ".*Researcher.*"
    timeout: 20000
- takeScreenshot: 01-inbox
- tapOn: "Activity"
- extendedWaitUntil:
    visible: ".*Recent.*"
    timeout: 15000
- takeScreenshot: 02-activity
- tapOn: "Activity"
- openLink: "unibots:///artifacts"
- extendedWaitUntil:
    visible: ".*launch-notes.txt.*|.*No artifacts yet.*|.*Artifacts.*"
    timeout: 15000
- takeScreenshot: 03-artifacts
