# Hermes Agent brain for Unibots.
#
# Layer this file over the normal stack and enable the profile:
#
#   docker compose --env-file .env \
#     -f infra/compose/docker-compose.images.yml \
#     -f infra/hermes/docker-compose.hermes.yml \
#     --profile hermes up -d
#
# Every Unibots bot gets its own Hermes profile (MEMORY.md, USER.md, SOUL.md,
# skills, sessions and state.db) created on first use by hermes-provisioner.
# The gateway multiplexes those profiles under /p/<profile>/.
name: unibots

x-hermes-image: &hermes-image ${UNIBOTS_HERMES_IMAGE:-nousresearch/hermes-agent:stable}

services:
  hermes:
    image: *hermes-image
    container_name: unibots-hermes
    restart: unless-stopped
    profiles: ["hermes"]
    command: ["gateway", "run"]
    environment:
      HERMES_UID: ${HERMES_UID:-10000}
      HERMES_GID: ${HERMES_GID:-10000}
      HERMES_HOME: /opt/data
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
      # Multiplex /p/<profile>/ from boot. Without this an unset flag lets the boot
      # preflight decide before the first bot profile exists, which leaves the
      # gateway single-profile and every per-bot request 404s.
      GATEWAY_MULTIPLEX_PROFILES: "true"
      # The root profile's key. Per-bot profiles receive their own derived key.
      API_SERVER_KEY: ${UNIBOTS_HERMES_API_KEY:?Set UNIBOTS_HERMES_API_KEY in .env}
      # Provider credentials for the configured Hermes model. Empty values pass
      # through from the host environment or .env when set.
      OPENROUTER_API_KEY:
      ANTHROPIC_API_KEY:
      OPENAI_API_KEY:
      GOOGLE_API_KEY:
      XAI_API_KEY:
      DEEPSEEK_API_KEY:
      MISTRAL_API_KEY:
    volumes:
      - unibots-hermes-data:/opt/data
    ports:
      # Loopback only. The API and worker reach the gateway over the Compose network.
      - "127.0.0.1:${UNIBOTS_HERMES_PORT:-8642}:8642"
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8642/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s

  hermes-provisioner:
    image: *hermes-image
    container_name: unibots-hermes-provisioner
    restart: unless-stopped
    profiles: ["hermes"]
    # Skip the s6 entrypoint: this is a small internal HTTP service, not a gateway.
    entrypoint: ["python3", "/opt/unibots/provisioner.py"]
    environment:
      HERMES_HOME: /opt/data
      HERMES_UID: ${HERMES_UID:-10000}
      HERMES_GID: ${HERMES_GID:-10000}
      UNIBOTS_HERMES_PROVISION_PORT: "8650"
      UNIBOTS_HERMES_PROVISION_SECRET: ${UNIBOTS_HERMES_PROVISION_SECRET:?Set UNIBOTS_HERMES_PROVISION_SECRET in .env}
      UNIBOTS_HERMES_PROFILE_SECRET: ${UNIBOTS_HERMES_PROFILE_SECRET:?Set UNIBOTS_HERMES_PROFILE_SECRET in .env}
      # The provisioner shells out to `hermes profile create`, which may read
      # these when cloning the root profile.
      OPENROUTER_API_KEY:
      ANTHROPIC_API_KEY:
      OPENAI_API_KEY:
    volumes:
      - unibots-hermes-data:/opt/data
      - ./provisioner.py:/opt/unibots/provisioner.py:ro
    expose:
      - "8650"
    depends_on:
      hermes:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8650/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  unibots-hermes-data:
    name: unibots-hermes-data
